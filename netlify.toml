[build]
  command = "npm run build"
  publish = "dist/phase-i"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/growth-webhook"
  to = "/.netlify/functions/growth-webhook"
  status = 200
  force = true

[[redirects]]
  from = "/api/submissions/assets/*"
  to = "/.netlify/functions/assets/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/submissions/assets"
  to = "/.netlify/functions/assets"
  status = 200
  force = true

[[redirects]]
  from = "/api/submissions/:kind"
  to = "/.netlify/functions/submissions?kind=:kind"
  status = 200
  force = true

[[redirects]]
  from = "/growth/book"
  to = "/growth/book/index.html"
  status = 200

[[redirects]]
  from = "/growth/book/*"
  to = "/growth/book/index.html"
  status = 200

[[redirects]]
  from = "/growth/apply"
  to = "/growth/apply/index.html"
  status = 200

[[redirects]]
  from = "/growth/apply/*"
  to = "/growth/apply/index.html"
  status = 200

[[redirects]]
  from = "/growth/thank-you"
  to = "/growth/thank-you/index.html"
  status = 200

[[redirects]]
  from = "/growth/thank-you/*"
  to = "/growth/thank-you/index.html"
  status = 200

[[redirects]]
  from = "/growth/partner"
  to = "/growth/partner/index.html"
  status = 200

[[redirects]]
  from = "/growth/partner/*"
  to = "/growth/partner/index.html"
  status = 200

[[redirects]]
  from = "/growth-engine"
  to = "/growth/partner/index.html"
  status = 200

[[redirects]]
  from = "/growth-engine/*"
  to = "/growth/partner/index.html"
  status = 200

[[redirects]]
  from = "/growth/visuals/*"
  to = "/growth/visuals/:splat"
  status = 200

[[redirects]]
  from = "/visuals/*"
  to = "/visuals/:splat"
  status = 200

[[redirects]]
  from = "/growth"
  to = "/growth/index.html"
  status = 200

[[redirects]]
  from = "/growth/*"
  to = "/growth/index.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact/index.html"
  status = 200

[[redirects]]
  from = "/contact/*"
  to = "/contact/index.html"
  status = 200

[[redirects]]
  from = "/company-builder"
  to = "/#review-builder"
  status = 302

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/portal/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store, no-cache, must-revalidate"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/api/submissions/assets/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store, no-cache, must-revalidate"
    Referrer-Policy = "no-referrer"
