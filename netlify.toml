[build]
  command = "npm run build"
  publish = "dist/phase-i"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/submissions/:kind"
  to = "/.netlify/functions/submissions?kind=:kind"
  status = 200

[[redirects]]
  from = "/company-builder"
  to = "/#review-builder"
  status = 302

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
